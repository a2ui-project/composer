name: Playwright Tests
on:
  push:
    paths:
      - "shell/e2e/**"
  pull_request:
    paths:
      - "shell/e2e/**"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable

      # Why: We defer dependency resolutions before E2E checks to establish
      # environment baseline parity with production without bleeding developer test-deps.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run Playwright tests
        run: yarn --cwd shell e2e-headless
        env:
          CI: "true"
