nodeLinker: node-modules

# The Slack sample draws its preview with the Renderer component of
# @tightknitai/storybook-addon-slack-block-kit, which doesn't use Storybook at
# run time. The addon declares Storybook as a peer dependency for its Storybook
# panel, so mark that peer optional instead of installing Storybook.
packageExtensions:
  '@tightknitai/storybook-addon-slack-block-kit@*':
    peerDependenciesMeta:
      storybook:
        optional: true
