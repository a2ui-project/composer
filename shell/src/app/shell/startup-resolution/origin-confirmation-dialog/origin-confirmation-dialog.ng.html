<h2 mat-dialog-title>Confirm External Renderer Origin</h2>
<mat-dialog-content>
  <p>
    The renderer URL uses an external origin: <strong>{{ data.origin }}</strong
    >.
  </p>
  <p>Do you want to allow loading this renderer?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" id="deny-origin-btn">Deny</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="true" id="allow-origin-btn">
    Allow
  </button>
</mat-dialog-actions>
