<mat-card class="demo-card" [class.is-error]="state() === 'error'">
  <header class="demo-card-header">
    <div class="demo-card-heading">
      <h2 class="demo-card-title">{{ demo().name }}</h2>
      <!-- Preserve the full renderer description for assistive technology and hover. -->
      <p class="demo-card-subtitle" [title]="demo().description">{{ demo().description }}</p>
    </div>

    <!-- Keep navigation separate from the interactive preview and first in tab order. -->
    <button
      mat-button
      type="button"
      class="demo-card-open"
      [attr.aria-label]="openLabel()"
      (click)="openInWorkspace()"
    >
      <mat-icon class="demo-card-open-icon" aria-hidden="true">north_east</mat-icon>
      Open in Composer
    </button>
  </header>

  <mat-card-content class="demo-card-content">
    <div
      #demoSurface
      class="demo-card-surface"
      [class.is-measured]="cardHeight() !== null"
      [attr.aria-busy]="showPlaceholder() && state() !== 'error'"
      [style.height.px]="surfaceHeight()"
    >
      @if (mount() && safeRendererUrl()) {
        <iframe
          #demoIframe
          [src]="safeRendererUrl()"
          sandbox="allow-scripts allow-same-origin allow-forms"
          class="demo-card-frame"
          [title]="demo().name + ' live demo'"
          (load)="onFrameLoad()"
        ></iframe>
      }

      @if (showPlaceholder()) {
        <div class="demo-card-placeholder" aria-hidden="true">
          <span class="preview-skeleton-title"></span>
          <span class="preview-skeleton-line"></span>
          <span class="preview-skeleton-block"></span>
          <span class="preview-skeleton-line short"></span>
        </div>
      }

      @if (state() === 'error') {
        <div class="demo-card-error" role="status">This demo could not be loaded.</div>
      }
    </div>
  </mat-card-content>
</mat-card>
