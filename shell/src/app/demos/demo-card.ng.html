<mat-card class="demo-card" [class.is-error]="state() === 'error'">
  <mat-card-header class="demo-card-header">
    <div class="demo-card-heading">
      <mat-card-title class="demo-card-title">{{ demo().name }}</mat-card-title>
      <!--
        The description is truncated to one line in CSS, never in the binding: the full
        text stays in the DOM, so assistive technology still reads it in full, and the
        native `title` attribute — the same mechanism the frame below already uses — puts
        it back within reach of a sighted reader on hover. Catalog descriptions repeat
        verbatim across demos ("Simple example demonstrating basic catalog components."),
        so at two lines of near-black they took the most prominent place on the card to
        say the least.
      -->
      <mat-card-subtitle class="demo-card-subtitle" [title]="demo().description">{{
        demo().description
      }}</mat-card-subtitle>
    </div>

    <!--
      The card's only navigation affordance, and deliberately a small explicit one
      rather than the whole card.

      The demo below is live: a reader can type into its form and press its buttons,
      and click accuracy through the preview transform is what the frame's
      `transform-origin` is pinned for. A card-sized click target would have to either
      swallow those interactions or fire navigation when someone meant to use the demo,
      and wrapping the card in a control is not available either — it contains an
      iframe with its own focusable content, which may not be nested inside a button
      or a link.

      So the target is this button and nothing else, and it sits before the frame in
      the tab order: keyboard readers reach "Open" on the way into a card rather than
      after traversing the demo inside it. It is revealed on hover and on `:focus-within`
      (see demo-card.scss) — the latter is what keeps it from being a mouse-only
      affordance, since focusing it reveals it. Its accessible name names the demo,
      because a wall of 43 buttons all called "Open" is no more use to a screen reader
      than no buttons at all.
    -->
    <button
      mat-button
      type="button"
      class="demo-card-open"
      [attr.aria-label]="openLabel()"
      (click)="openInWorkspace()"
    >
      <mat-icon class="demo-card-open-icon">edit</mat-icon>
      Open
    </button>
  </mat-card-header>

  <mat-card-content class="demo-card-content">
    <div
      class="demo-card-surface"
      [class.is-measured]="cardHeight() !== null"
      [style.height.px]="surfaceHeight()"
    >
      @if (mount() && safeRendererUrl()) {
        <iframe
          #demoIframe
          [src]="safeRendererUrl()"
          sandbox="allow-scripts allow-same-origin allow-forms"
          class="demo-card-frame"
          [title]="demo().name + ' live demo'"
          (load)="onFrameLoad()"
        ></iframe>
      }

      @if (showPlaceholder()) {
        <div class="demo-card-placeholder" aria-hidden="true"></div>
      }

      @if (state() === 'error') {
        <div class="demo-card-error" role="status">This demo could not be loaded.</div>
      }
    </div>
  </mat-card-content>
</mat-card>
