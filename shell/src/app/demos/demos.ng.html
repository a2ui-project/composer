<div class="demos-container">
  <!--
    The coordinator frame is mounted unconditionally and kept visually hidden. It is
    the only frame on this page that registers as the bridge's primary target, and
    its handshake is what resolves the active catalog that gates the GET_DEMOS
    request. Mounting frames only once demos had arrived could never bootstrap.
  -->
  <div #coordinatorHost class="coordinator-frame" aria-hidden="true">
    <a2ui-composer-rendered-frame></a2ui-composer-rendered-frame>
  </div>

  <header class="demos-header">
    <h1 class="demos-title">Demos</h1>
    <p class="demos-subtitle">Live demos served by the connected renderer.</p>
  </header>

  @if (isResolving()) {
    <div class="demos-loading" role="status">
      <mat-spinner diameter="32"></mat-spinner>
      <span>Loading demos...</span>
    </div>
  } @else if (isEmpty()) {
    <div class="empty-state">
      <mat-icon class="empty-icon">auto_awesome_mosaic</mat-icon>
      <h3 class="empty-title">No Demos Available</h3>
      <p class="empty-subtitle">This renderer doesn't provide demos yet.</p>
    </div>
  } @else {
    <div class="demos-wall">
      @for (demo of demos() ?? []; track demo.trackKey) {
        <a2ui-composer-demo-card
          #cardHost
          [attr.data-demo-key]="demo.trackKey"
          [demo]="demo"
          [mount]="mountedKeys().has(demo.trackKey)"
        ></a2ui-composer-demo-card>
      }
    </div>
  }
</div>
