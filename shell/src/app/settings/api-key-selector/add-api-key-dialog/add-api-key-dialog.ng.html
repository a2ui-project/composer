<h2 mat-dialog-title>{{ data?.apiKey ? 'Edit Gemini API Key' : 'Add Gemini API Key' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="$event.preventDefault(); onConfirm()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput id="api-key-name-input" formControlName="name" placeholder="My Gemini Key" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>API Key</mat-label>
      <input
        matInput
        id="api-key-value-input"
        [type]="hideApiKey() ? 'password' : 'text'"
        formControlName="apiKey"
        placeholder="Paste your API key here"
      />
      <button
        mat-icon-button
        matSuffix
        class="api-key-toggle-btn"
        type="button"
        (click)="toggleHideApiKey()"
        [attr.aria-label]="hideApiKey() ? 'Show API key' : 'Hide API key'"
      >
        <mat-icon aria-hidden="true">{{ hideApiKey() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (errorMessage()) {
      <div class="error-message" role="alert">{{ errorMessage() }}</div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-button type="submit" color="primary" [disabled]="form.invalid" (click)="onConfirm()">
    {{ data?.apiKey ? 'Save' : 'Add' }}
  </button>
</mat-dialog-actions>
