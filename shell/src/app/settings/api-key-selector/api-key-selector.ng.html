<div class="api-key-selector-container">
  <mat-form-field appearance="outline" class="api-key-selector-form-field">
    <mat-label>API Key</mat-label>
    <mat-select
      id="api-key-select"
      [value]="selectedApiKeyId()"
      [disabled]="disabled()"
      (selectionChange)="onSelectionChange($event.value)"
    >
      <mat-select-trigger>
        {{ selectedItem()?.name }}
      </mat-select-trigger>
      @if (items().length === 0) {
        <mat-option [disabled]="true" class="empty-state-option"
          >No items available — click + to add</mat-option
        >
      } @else {
        @for (key of items(); track key.id) {
          <mat-option [value]="key.id" class="api-key-option">
            <span class="api-key-option-label">{{ key.name }}</span>
            <button
              mat-icon-button
              type="button"
              class="edit-api-key-button"
              [attr.aria-label]="'Edit ' + key.name"
              [disabled]="key.readOnly"
              [matTooltip]="
                key.readOnly ? 'Static configuration items cannot be edited' : 'Edit API key'
              "
              (keydown)="$event.stopPropagation()"
              (click)="onEditApiKey($event, key)"
            >
              <mat-icon aria-hidden="true">edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              class="delete-api-key-button"
              [attr.aria-label]="'Delete ' + key.name"
              [disabled]="key.readOnly"
              [matTooltip]="
                key.readOnly ? 'Static configuration items cannot be deleted' : 'Delete API key'
              "
              (keydown)="$event.stopPropagation()"
              (click)="onDeleteApiKey($event, key.id)"
            >
              <mat-icon aria-hidden="true">delete</mat-icon>
            </button>
          </mat-option>
        }
      }
    </mat-select>
  </mat-form-field>
  <button
    mat-icon-button
    type="button"
    class="add-api-key-button"
    aria-label="Add Gemini API key"
    [disabled]="disabled()"
    (click)="onAddApiKey($event)"
  >
    <mat-icon>add_circle</mat-icon>
  </button>
</div>
