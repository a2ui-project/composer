<h2 mat-dialog-title>{{ data?.renderer ? 'Edit Custom Renderer' : 'Add Custom Renderer' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="$event.preventDefault(); onConfirm()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput id="renderer-name-input" formControlName="name" placeholder="My Renderer" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Renderer URL</mat-label>
      <input
        matInput
        id="renderer-url-input"
        formControlName="rendererUrl"
        placeholder="http://localhost:3000"
      />
    </mat-form-field>

    @if (errorMessage()) {
      <div class="error-message" role="alert">{{ errorMessage() }}</div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-button type="submit" color="primary" [disabled]="form.invalid" (click)="onConfirm()">
    {{ data?.renderer ? 'Save' : 'Add' }}
  </button>
</mat-dialog-actions>
