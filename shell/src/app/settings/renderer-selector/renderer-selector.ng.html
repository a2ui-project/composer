<div class="renderer-selector-container">
  <mat-form-field appearance="outline" class="renderer-selector-form-field">
    <mat-label>Renderer</mat-label>
    <mat-select
      id="renderer-select"
      [value]="selectedRendererId()"
      [disabled]="disabled()"
      (selectionChange)="onSelectionChange($event.value)"
    >
      <mat-select-trigger>
        <div class="renderer-trigger-content">
          <span class="renderer-name">{{ selectedItem()?.name }}</span>
          @if (selectedItem()?.rendererUrl) {
            <span class="renderer-url-subtext">{{ selectedItem()?.rendererUrl }}</span>
          }
        </div>
      </mat-select-trigger>
      @if (items().length === 0) {
        <mat-option [disabled]="true" class="empty-state-option"
          >No items available — click + to add</mat-option
        >
      } @else {
        @for (renderer of items(); track renderer.id) {
          <mat-option [value]="renderer.id" class="renderer-option">
            <div class="renderer-option-content">
              <div class="renderer-option-label">{{ renderer.name }}</div>
              <div class="renderer-url-subtext">{{ renderer.rendererUrl }}</div>
            </div>
            <button
              mat-icon-button
              type="button"
              class="edit-renderer-button"
              [attr.aria-label]="'Edit ' + renderer.name"
              [disabled]="renderer.readOnly"
              [matTooltip]="
                renderer.readOnly ? 'Static configuration items cannot be edited' : 'Edit renderer'
              "
              (click)="onEditRenderer($event, renderer)"
              (keydown)="$event.stopPropagation()"
            >
              <mat-icon aria-hidden="true">edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              class="delete-renderer-button"
              [attr.aria-label]="'Delete ' + renderer.name"
              [disabled]="renderer.readOnly"
              [matTooltip]="
                renderer.readOnly
                  ? 'Static configuration items cannot be deleted'
                  : 'Delete renderer'
              "
              (click)="onDeleteRenderer($event, renderer.id)"
              (keydown)="$event.stopPropagation()"
            >
              <mat-icon aria-hidden="true">delete</mat-icon>
            </button>
          </mat-option>
        }
      }
    </mat-select>
  </mat-form-field>
  <button
    mat-icon-button
    type="button"
    class="add-renderer-button"
    aria-label="Add custom renderer"
    [disabled]="disabled()"
    (click)="onAddRenderer($event)"
  >
    <mat-icon>add_circle</mat-icon>
  </button>
</div>
