<div class="model-selector-container">
  <mat-form-field appearance="outline" class="model-selector-form-field">
    <mat-label>Model</mat-label>
    <mat-select
      id="model-select"
      [value]="modelSelection.selectedModelId()"
      [disabled]="disabled()"
      (selectionChange)="onModelChange($event.value)"
    >
      @for (model of modelSelection.models(); track model.id) {
        <mat-option [value]="model.id">{{ model.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (thinkingLevelOptions().length > 0) {
    <mat-form-field appearance="outline" class="thinking-level-form-field">
      <mat-label>Thinking level</mat-label>
      <mat-select
        id="thinking-level-select"
        [value]="modelSelection.thinkingLevel()"
        [disabled]="disabled()"
        (selectionChange)="onThinkingLevelChange($event.value)"
      >
        @for (option of thinkingLevelOptions(); track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</div>
