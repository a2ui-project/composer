<div class="a2a-chat-view-root">
  <a2ui-composer-agent-header
    [agentInfo]="agentInfo()"
    [agentCard]="agentCard()"
    [activeTaskId]="activeTaskId()"
    [sessionId]="activeContextId()"
    [isInspectorOpen]="isInspectorOpen()"
    (toggleInspector)="toggleInspectorDrawer()"
    (resetSession)="resetActiveSession()"
    (openSettings)="openConfigPanel()"
  ></a2ui-composer-agent-header>

  <main
    class="chat-main-layout"
    [class.with-inspector]="isInspectorOpen()"
    [class.with-canvas]="isCanvasOpen()"
  >
    <!-- Left Conversation Stream Area -->
    <div class="chat-viewport-column">
      <div class="history-wrapper">
        <a2ui-composer-chat-history
          [messages]="messages()"
          [agentInfo]="agentInfo()"
          [isStreaming]="isStreaming()"
          [isConnecting]="isConnecting()"
          [endpoint]="configProvider.a2aAgentUrl() || ''"
          [isCanvasOpen]="isCanvasOpen()"
          [activeCanvasPayload]="activeCanvasPayload()"
          (samplePromptClicked)="submitSamplePrompt($event)"
          (openCanvas)="openCanvasSurface($event)"
          (closeCanvas)="closeCanvasSurface()"
          (openInspector)="toggleInspectorDrawer()"
        ></a2ui-composer-chat-history>
      </div>

      <div class="input-wrapper">
        <a2ui-composer-input-area
          [isStreaming]="isStreaming()"
          [disabled]="isConnecting()"
          (sendMessage)="sendUserMessage($event)"
          (stopGeneration)="cancelActiveGeneration()"
        ></a2ui-composer-input-area>
      </div>
    </div>

    <!-- Center Canvas Viewport (Opened only when View in Canvas is clicked) -->
    @if (isCanvasOpen()) {
      <div class="side-canvas-column">
        <div class="side-canvas-header">
          <div class="canvas-title">
            <mat-icon class="canvas-icon">dashboard_customize</mat-icon>
            <h3>A2UI Surface Canvas</h3>
          </div>
          <button
            mat-icon-button
            type="button"
            (click)="closeCanvasSurface()"
            matTooltip="Close Canvas Preview"
            aria-label="Close Canvas Preview"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <div class="side-canvas-viewport">
          <a2ui-composer-rendered-frame></a2ui-composer-rendered-frame>
        </div>
      </div>
    }

    <!-- Right Inspector Side Drawer with Resizable Splitter Handle -->
    @if (isInspectorOpen()) {
      <div
        class="inspector-resize-handle"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize A2A message inspection panel"
        [attr.aria-valuenow]="inspectorWidth()"
        [attr.aria-valuemin]="280"
        tabindex="0"
        (mousedown)="startInspectorResize($event)"
        (keydown)="handleInspectorResizeKey($event)"
      >
        <div class="resize-grip"></div>
      </div>

      <div class="inspector-column" [style.width.px]="inspectorWidth()">
        <a2ui-composer-message-inspector
          [events]="inspectorEvents()"
          (closeDrawer)="toggleInspectorDrawer()"
          (clearEvents)="clearInspectorEvents()"
        ></a2ui-composer-message-inspector>
      </div>
    }
  </main>

  <!-- Agent Configuration Modal Dialog -->
  @if (isConfigPanelOpen()) {
    <a2ui-composer-agent-config-panel
      [initialEndpoint]="configProvider.a2aAgentUrl()"
      [initialTenantId]="configProvider.a2aTenantId()"
      [initialBackendMode]="configProvider.a2aBackendMode()"
      [isConnecting]="isConnecting()"
      [connectionError]="connectionError()"
      [canCancel]="!!agentCard()"
      (saveAndConnect)="saveAgentConfiguration($event)"
      (clearConfig)="clearAgentConfiguration()"
      (dismissPanel)="isConfigPanelOpen.set(false)"
    ></a2ui-composer-agent-config-panel>
  }
</div>
