<div class="input-area-container" [class.disabled]="disabled()">
  <div class="input-card">
    @if (attachmentChips().length > 0) {
      <div class="attached-images-tray">
        @for (chip of attachmentChips(); track $index) {
          <div class="image-chip">
            <mat-icon class="chip-file-icon">{{ chip.icon }}</mat-icon>
            <span class="chip-name" [matTooltip]="chip.name" [title]="chip.name">
              {{ chip.name }}
            </span>
            <button
              mat-icon-button
              type="button"
              class="remove-img-btn"
              (click)="removeAttachedImage($index)"
              aria-label="Remove attachment"
            >
              <mat-icon>close</mat-icon>
            </button>
          </div>
        }
      </div>
    }

    @if (attachmentError()) {
      <div class="attachment-error" role="alert">{{ attachmentError() }}</div>
    }

    <textarea
      #textarea
      class="prompt-textarea"
      [value]="inputText()"
      (input)="handleTextInput($event)"
      (keydown)="handleKeyDown($event)"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      aria-label="Message prompt input"
      rows="2"
    ></textarea>

    <div class="input-toolbar">
      <button
        mat-icon-button
        type="button"
        class="add-btn"
        (click)="openFilePicker()"
        [disabled]="disabled() || isStreaming()"
        matTooltip="Add attachments or actions"
        aria-label="Add attachments or actions"
      >
        <mat-icon>add</mat-icon>
      </button>
      <!--
        No accept filter: the shell does not know which types the connected
        agent understands, and size and count are capped in the component.
      -->
      <input
        #fileInput
        type="file"
        multiple
        class="hidden-file-input"
        (change)="handleFileSelection($event)"
        aria-label="Upload file attachments"
      />

      <span class="toolbar-spacer"></span>

      @if (isStreaming()) {
        <button
          mat-icon-button
          type="button"
          class="stop-circle-btn"
          (click)="cancelGeneration()"
          matTooltip="Stop generating"
          aria-label="Stop generating response"
        >
          <mat-icon>stop</mat-icon>
        </button>
      } @else {
        <button
          mat-icon-button
          type="button"
          class="send-circle-btn"
          (click)="submitPrompt()"
          [disabled]="disabled() || (!inputText().trim() && attachedImages().length === 0)"
          matTooltip="Send message (Enter)"
          aria-label="Send message"
        >
          <mat-icon>arrow_forward</mat-icon>
        </button>
      }
    </div>
  </div>
</div>
