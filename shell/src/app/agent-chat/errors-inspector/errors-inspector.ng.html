<aside class="errors-inspector" aria-labelledby="errors-inspector-title">
  <div class="errors-inspector-header">
    <div class="header-title">
      <mat-icon class="header-icon" aria-hidden="true">error_outline</mat-icon>
      <h3 id="errors-inspector-title" class="errors-inspector-title">Errors</h3>
    </div>
    <div class="header-controls">
      <button
        mat-icon-button
        type="button"
        aria-label="Close Errors"
        matTooltip="Close Errors"
        (click)="closeDrawer.emit()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
  <div class="errors-inspector-content">
    <a2ui-composer-errors />
  </div>
</aside>
